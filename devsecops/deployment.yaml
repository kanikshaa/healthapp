apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthapp-secure
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthapp-secure
  template:
    metadata:
      labels:
        app: healthapp-secure
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: healthapp
        image: kkanikshaa/healthapp:SECURE_TAG
        ports:
        - containerPort: 5000
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: patient-db-secret
              key: DB_PASSWORD
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { cpu: 200m, memory: 128Mi }
        readinessProbe:
          httpGet: { path: /health, port: 5000 }
          initialDelaySeconds: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
