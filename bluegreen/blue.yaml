apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthapp-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthapp
      version: blue
  template:
    metadata:
      labels:
        app: healthapp
        version: blue
    spec:
      containers:
      - name: healthapp
        image: kkanikshaa/healthapp:4
        ports:
        - containerPort: 5000
