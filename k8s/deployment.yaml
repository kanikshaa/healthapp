apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthapp
  template:
    metadata:
      labels:
        app: healthapp
    spec:
      containers:
      - name: healthapp
        image: kkanikshaa/healthapp:latest
        ports:
        - containerPort: 5000
